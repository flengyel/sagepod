version: "3.8"

services:
  sagemath:
    image: localhost/sagepod-sagemath:${SAGE_TAG:-10.8}-pycryptosat
    container_name: ${CONTAINER_NAME:-sagepod}

    network_mode: ${SAGEPOD_NETWORK_MODE:-slirp4netns}

    working_dir: /sage

    user: "1000:1000"

    ports:
      - "${PORT:-8889}:8888"

    environment:
      - HOME=/home/sage
      - DOT_SAGE=/home/sage/.sage

      # Force Jupyter + friends to use writable XDG locations
      - XDG_DATA_HOME=/home/sage/.local/share
      - XDG_CONFIG_HOME=/home/sage/.config
      - XDG_CACHE_HOME=/home/sage/.cache
      - JUPYTER_RUNTIME_DIR=/home/sage/.local/share/jupyter/runtime

    command:
      - bash
      - -c
      - >
        set -euo pipefail;
        mkdir -p /home/sage/.local/share/jupyter/runtime /home/sage/.config /home/sage/.cache &&
        exec ./sage -n jupyter --no-browser --ip=0.0.0.0 --port=8888 --notebook-dir=/home/sage/notebooks

    volumes:
      # These two directories may also be mounted by other Sage containers.
      - ${HOME}/Jupyter:/home/sage/notebooks:z,U
      - ${HOME}/.jupyter:/home/sage/.jupyter:z,U
      - ${HOME}/.sagepod-dot_sage:/home/sage/.sage:Z,U

      - ${HOME}/.sagepod-local:/home/sage/.local:Z,U
      - ${HOME}/.sagepod-config:/home/sage/.config:Z,U
      - ${HOME}/.sagepod-cache:/home/sage/.cache:Z,U

